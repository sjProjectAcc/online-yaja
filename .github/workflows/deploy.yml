name: Deploy to GitHub Pages

# 저장소가 비공개(무료 요금제)라 GitHub Pages를 쓸 수 없어서, 푸시할 때 자동으로 돌지 않게 해 두었다.
# 공개로 바꾸거나 유료 요금제가 되면 아래 push 두 줄의 주석을 풀면 된다.
# 비공개로 계속 쓸 때의 배포는 Cloudflare Pages 등에 web/ 폴더를 연결하는 방식으로 정한다 (ROADMAP 10장).
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # 저장소 Settings > Secrets and variables > Actions 에 넣는다. 없으면 로컬 테스트 모드로 빌드된다.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
